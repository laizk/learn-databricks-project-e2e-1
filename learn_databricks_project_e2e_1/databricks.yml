# This is a Databricks asset bundle definition for learn_databricks_project_e2e_1.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: learn_databricks_project_e2e_1
  uuid: fae3e3b2-e330-4d08-a9ce-1b0066ff80cc

include:
  - resources/*.yml
  - resources/*/*.yml
  - src/*/resources/*.yml
  - src/*/resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-d2b217aa-db08.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-d2b217aa-db08.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/kristoffer.laiz@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kristoffer.laiz@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: kristoffer.laiz@gmail.com
        level: CAN_MANAGE
